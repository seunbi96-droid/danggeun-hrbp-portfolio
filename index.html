<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>송은비 포트폴리오 | 당근 HRBP - 경영지원(피플)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 좌측에서 공고 요건을 고르면 연결된 사례만 남는 구조 */
:root{
  --bg:#faf6f2; --panel:#ffffff; --ink:#2a1a10; --muted:#7a6552; --line:#eadccf;
  --hero:#c9510c; --accent:#e8590c; --accent-soft:#fff0e5; --on-hero:#ffffff;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif; --f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a120c; --panel:#251a12; --ink:#f7ece2; --muted:#c7ad98; --line:#41301f;
    --hero:#7a2a08; --accent:#ff9a57; --accent-soft:#3a2314; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.7;font-size:15px;letter-spacing:-.01em}
.hero{background:var(--hero);color:var(--on-hero);padding:34px 20px 30px}
.wrap{max-width:1080px;margin:0 auto}
.pill{display:inline-block;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:2px 12px;margin-bottom:10px}
.hero h1{font-family:var(--f-display);font-size:30px;margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:#ffe3cc;font-size:14px;line-height:1.8}
main{max-width:1080px;margin:0 auto;padding:22px 16px 48px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:12px}
aside h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.grp{margin:0 0 14px}
.chips{display:flex;flex-direction:column;gap:6px}
.req{font:inherit;font-size:13px;line-height:1.5;text-align:center;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.req:hover{border-color:var(--accent)}
.req:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.req[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.reset{font:inherit;font-size:13px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:8px;cursor:pointer}
.status{font-size:13px;color:var(--muted);margin:0 0 12px}
.status b{color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px}
.card[hidden]{display:none}
.no{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.card h3{margin:0;font-size:17px;line-height:1.5;text-wrap:balance}
.org{font-size:12px;color:var(--muted);margin:2px 0 8px}
.col2{grid-column:2}
.rows{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 12px;margin:0 0 10px}
.rows dt{font-size:12px;font-weight:700;color:var(--muted);padding-top:2px}
.rows dd{margin:0;max-width:68ch}
.res{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.res b{color:var(--accent);margin-right:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
footer{max-width:1080px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{position:static}
  .chips{flex-direction:row;flex-wrap:wrap}
  .rows{grid-template-columns:minmax(0,1fr)}
  .rows dt{padding-top:0}
}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .15s}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <span class="pill">당근 HRBP - 경영지원(피플) 지원</span>
  <h1>송은비 포트폴리오</h1>
  <p>공고의 요건마다 제가 실제로 한 일을 연결했습니다.<br>
급여 데이터를 끝까지 대조해 차액의 원인을 찾았고,<br>
담당자가 없던 업무에는 양식과 체계를 먼저 만들었습니다.<br>
석사 과정에서는 공동체의 일상 공간에서 일어나는 돌봄과 학습을 관찰하며,<br>
구성원이 어떤 조건에서 마음을 놓고 일하는지 보는 눈을 길렀습니다.</p>
</div></header>
<main>
  <aside aria-label="공고 요건">
    <div id="groups"></div>
    <button class="reset" id="reset" type="button">전체 사례 보기</button>
  </aside>
  <section aria-live="polite">
    <p class="status" id="status"></p>
    <div class="cards" id="cards"></div>
  </section>
</main>
<footer>현 직장에서 한 일은 금액, 사업부문, 거래 상대를 빼고 일반화해 적었습니다. 학교 행정실 사례의 수치는 당시 업무 기록을 기준으로 합니다.</footer>
<script>
var CASES = [{"no": "01", "title": "법정의무교육이 따로 계약된 구조를 발견해 본사 통합안을 만들고, 교육 업무 일원화를 제안했습니다", "org": "씨티씨바이오 경영기획실 · 사원", "rows": [["문제", "협력사 ESG 평가에 대응하려고 사업장 자료를 취합하던 중, 본사와 사업장이 법정의무교육을 각각 따로 계약하고 있고 사업장 쪽 단가가 더 높다는 것을 발견했습니다. 본사 안에서도 두 부서가 교육을 나누어 진행하고 있었습니다."], ["진단", "24·25년 지출 내역과 26년 견적을 비교해, 분산 계약이 비용과 관리 양쪽에서 비효율이라는 것을 수치로 확인했습니다."], ["결과", "일원화 제안이 승인되어 교육 업무가 인사총무팀으로 이관되었습니다. 최종 계약은 인사총무팀이 체결했고, 26년 기준 교육비가 약 47% 절감되었습니다. 27년 사업장 통합과 단일 계약을 목표로 추진하고 있습니다."]]}, {"no": "02", "title": "급여 데이터 24개월을 대조해 예수금 계좌 차액의 원인을 찾았습니다", "org": "서울대학교 생활과학대학 행정실 · 회계 담당자", "rows": [["문제", "전임자 때부터 쌓여 온 단시간 근로자 급여 세금 예수금에, 공제한 세금과 실제 납부한 세금 사이 약 400만원의 차액이 남아 있었습니다."], ["한 일", "월 평균 4건, 약 24개월치 급여 데이터를 공제액과 실제 납부액 기준으로 비교하는 엑셀을 직접 만들어 건별로 대조했습니다."], ["결과", "원인을 규명해 260만원은 과공제분으로 재직자와 퇴사자 모두에게 환급했습니다. 나머지 140만원은 여러 단과대학이 함께 쓰는 계좌라 원인을 특정하지 못해, 분석 자료와 함께 인수인계했습니다. 관리 기준은 문서로 남겼습니다."], ["배운 점", "숫자가 맞지 않을 때 원본 데이터까지 내려가 원인을 정의하고, 이어받는 사람이 같은 기준으로 볼 수 있게 남기는 일입니다."]]}, {"no": "03", "title": "담당자가 없던 원천세·4대보험 신고 업무를 맡아 양식과 일정 체계를 만들었습니다", "org": "서울대학교 생활과학대학 행정실 · 회계 담당자", "rows": [["문제", "원천세·4대보험 신고 담당이 비어 신고 기한을 놓치면 가산세가 생길 수 있는 상황이었습니다."], ["한 일", "지시를 기다리지 않고 직접 인수해 입력 양식, 체크리스트, 일정 관리표를 만들고 업무 매뉴얼로 정리했습니다. 급여 지급과 급여명세서 발급(SAP), 4대보험 취득·상실·정산, 원천세 신고·납부, 연말정산 자료 준비도 함께 운영했습니다."], ["결과", "한 해 동안 신고를 오류 없이 기한 내에 마쳤습니다."]]}, {"no": "04", "title": "휴가 입력, 법인카드 분류, 회의록 정리에 AI를 붙여 일하는 방식을 바꿨습니다", "org": "씨티씨바이오 경영기획실 · 사원 · 2026.05 ~ 현재", "rows": [["휴가 입력", "이전에는 휴가 신청이 올 때마다 수시로 접속해 확인하고 부서 캘린더에 직접 입력해야 했습니다. 지금은 AI가 매일 점심시간에 결재가 끝난 휴가를 확인해 캘린더에 입력합니다."], ["법인카드", "이전에는 카드사에서 월별 매출전표를 받아 엑셀로 가공하고 계정과목을 일일이 분류한 뒤 전표를 입력했습니다. 지금은 AI가 계정과목 분류까지 맡고, 저는 분류 결과를 한 번 검토합니다. 지급전표 입력은 직접 합니다."], ["회의록", "AI가 회의에 참석해 참석자별로 녹취록을 작성합니다. 저는 녹취록을 읽으며 회의에서 나온 내용과 맞는지 검수하고, 지시사항을 부문별로 정리해 회의록과 함께 배포합니다."], ["방식", "반복 작업과 정리는 AI가, 검토와 최종 입력은 사람이 맡도록 선을 그었습니다."]]}, {"no": "05", "title": "신입생 선발 전 과정을 운영했습니다", "org": "서울대학교 여성학협동과정 행정실 · 학과 전임조교 · 2023.03 ~ 2024.02", "rows": [["규모", "지원자는 학기당 통상 10명 미만, 합격자는 학기당 2명이었습니다."], ["한 일", "입시설명회를 기획·운영하고, 접수부터 면접 안내·면접 준비·최종 등록 안내까지 전 과정을 맡았습니다. 외부 교수 섭외를 포함해 면접위원 3명을 직접 조율했고, 면접날 다과에는 지원자 성향을 고려해 비건 옵션을 넣었습니다. 지원자 안내는 메일을 우선으로 했고, 온라인 제출 후 우편·직접 제출 서류가 도착하지 않으면 유선으로 먼저 확인했습니다."], ["결과", "일정 차질 없이 진행했고 합격자 전원이 등록했습니다."]]}, {"no": "06", "title": "신입생 수요를 먼저 조사해 온보딩 세미나를 재설계했습니다", "org": "서울대학교 여성학협동과정 행정실 · 학과 전임조교 · 2023.03 ~ 2024.02", "rows": [["한 일", "OT에서 관심 주제를 묻고 세미나 직전 설문·면담으로 수요를 파악했습니다. 개념 중심이던 기존 구성에서 이슈페이퍼·발제문 작성법 같은 실무 스킬 수요를 확인해, 재학생도 들을 수 있는 오픈 특별세미나로 직접 기획하고 이슈페이퍼를 많이 쓰는 학기 중인 석사생을 강사로 모집했습니다."], ["결과", "신입생 4명이 수강할 예정이었으나 석사과정생까지 열 명 이상이 수강했습니다."]]}];
var REQS = [{"g": "자격요건", "items": [{"t": "채용·조직문화·HRM 영역에서\n높은 몰입도로 일한 경험", "c": ["03", "05", "06"]}, {"t": "주어진 역할을 넘어\n문제를 스스로 발견하고 해결한 경험", "c": ["01", "02", "03"]}, {"t": "사업, 제품, 조직이\n작동하는 방식에 대한 관심", "c": ["01"]}, {"t": "다양한 정보를 근거로 판단하고\n명확하게 설명", "c": ["01", "02"]}, {"t": "빠르게 배우고\n실제 변화와 결과를 만들어냄", "c": ["01", "03"]}]}, {"g": "우대사항", "items": [{"t": "HR 전반의 일을 경계 없이,\n직접 구축해 본 경험\n(양식·교육 체계 등)", "c": ["01", "03", "06"]}, {"t": "AI를 업무에 적극적으로 활용하며\n더 효과적으로 일하는 방식을\n만들어 본 경험", "c": ["04"]}]}];
var active = null;
var $ = function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function tagsFor(no){
  var out=[];
  REQS.forEach(function(g){g.items.forEach(function(r){ if(r.c.indexOf(no)>-1) out.push(r.t.replace(/\n/g,' ')); });});
  return out;
}
function renderCards(){
  $("cards").innerHTML = CASES.map(function(c){
    var body = c.rows.filter(function(r){return r[0]!=="결과"}).map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join("");
    var res = c.rows.filter(function(r){return r[0]==="결과"})[0];
    var tg = tagsFor(c.no).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("");
    return '<article class="card" data-no="'+c.no+'">'+
      '<div class="no">'+c.no+'</div>'+
      '<div><h3>'+esc(c.title)+'</h3><div class="org">'+esc(c.org)+'</div></div>'+
      '<div class="col2"><dl class="rows">'+body+'</dl>'+
      (res?'<div class="res"><b>결과</b>'+esc(res[1])+'</div>':'')+
      '<div class="tags">'+tg+'</div></div></article>';
  }).join("");
}
function renderGroups(){
  $("groups").innerHTML = REQS.map(function(g,gi){
    return '<div class="grp"><h2>'+g.g+'</h2><div class="chips">'+
      g.items.map(function(r,ri){
        return '<button type="button" class="req" aria-pressed="false" data-g="'+gi+'" data-r="'+ri+'">'+esc(r.t).replace(/\n/g,'<br>')+'</button>';
      }).join("")+'</div></div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".req"),function(b){
    b.addEventListener("click",function(){
      var r = REQS[+b.dataset.g].items[+b.dataset.r];
      active = (active===r) ? null : r;
      update();
    });
  });
}
function update(){
  var shown=0;
  Array.prototype.forEach.call(document.querySelectorAll(".card"),function(el){
    var ok = !active || active.c.indexOf(el.dataset.no)>-1;
    el.hidden = !ok; if(ok) shown++;
  });
  Array.prototype.forEach.call(document.querySelectorAll(".req"),function(b){
    b.setAttribute("aria-pressed", String(active===REQS[+b.dataset.g].items[+b.dataset.r]));
  });
  $("status").innerHTML = active
    ? '<b>'+esc(active.t.replace(/\n/g,' '))+'</b>와 연결된 사례 '+shown+'개'
    : '';
  $("status").hidden = !active;
}
$("reset").addEventListener("click",function(){active=null;update();});
renderCards(); renderGroups(); update();
</script>
</body>
</html>
